name: Build AetherOS APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.bootstrap/**'
      - '.overrides/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct source tree
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p app
          cat \
            .bootstrap/fix000-0 \
            .bootstrap/fix000-1 \
            .bootstrap/fix000-2 \
            .bootstrap/fix000-3 \
            .bootstrap/aether-src.xz.b64.part-001 \
            .bootstrap/aether-src.xz.b64.part-002 \
            .bootstrap/aether-src.xz.b64.part-003 \
            .bootstrap/fix004-0 \
            .bootstrap/fix004-1 \
            .bootstrap/fix004-2 \
            .bootstrap/fix004-30 \
            .bootstrap/fix004-31 \
            .bootstrap/fix004-32 \
            .bootstrap/fix004-33 \
            .bootstrap/aether-src.xz.b64.part-005 \
            .bootstrap/aether-src.xz.b64.part-006 \
            .bootstrap/aether-src.xz.b64.part-007 \
            .bootstrap/aether-src.xz.b64.part-008 \
            .bootstrap/aether-src.xz.b64.part-009 \
            .bootstrap/aether-src.xz.b64.part-010 \
            .bootstrap/aether-src.xz.b64.part-011 \
            > /tmp/aether-src.tar.xz.b64
          base64 --decode /tmp/aether-src.tar.xz.b64 > /tmp/aether-src.tar.xz
          tar -xJf /tmp/aether-src.tar.xz -C app
          test -f app/package.json

      - name: Apply real launcher conversion
        shell: bash
        run: |
          set -euxo pipefail
          base64 --decode .overrides/clean-launcher.patch.gz.b64 | gzip -dc > /tmp/clean-launcher.patch
          (cd app && patch -p1 < /tmp/clean-launcher.patch)

          # Remove the old simulator/demo surface completely.
          rm -rf \
            app/src/components/chassis \
            app/src/components/device \
            app/src/components/ephemeral \
            app/src/components/google \
            app/src/components/inspector \
            app/src/components/lock \
            app/src/components/permanent \
            app/src/components/tools \
            app/src/components/system \
            app/src/components/modals
          rm -f \
            app/src/components/effects/CyberDeveloperHudOverlay.tsx \
            app/src/components/apps/CalculatorApp.tsx \
            app/src/components/apps/CameraApp.tsx \
            app/src/components/apps/ClockApp.tsx \
            app/src/components/apps/MusicApp.tsx \
            app/src/components/apps/NotesApp.tsx \
            app/src/components/apps/PhoneApp.tsx \
            app/src/components/apps/TerminalApp.tsx \
            app/src/components/apps/WeatherApp.tsx \
            app/src/data/conciergeData.ts \
            app/src/types/concierge.ts

          ! grep -R "Pixel10ProShell\|Dr. Evelyn Vance\|MarkGpsEngine\|SentinelFirewallAndSyslog" -n app/src
          grep -q "HomeScreen" app/src/App.tsx
          grep -q "NativeLauncher" app/src/App.tsx
          echo "Clean native launcher source ready"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install npm dependencies
        working-directory: app
        run: npm install --no-audit --no-fund

      - name: Type-check launcher
        working-directory: app
        run: npm run lint

      - name: Build Android APK
        working-directory: app
        shell: bash
        run: |
          set -euxo pipefail
          npm run build:apk
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          mkdir -p ../artifacts
          cp "$APK" ../artifacts/AetherOS-clean-debug.apk
          ls -lh ../artifacts/AetherOS-clean-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AetherOS-clean-debug-apk
          path: artifacts/AetherOS-clean-debug.apk
          if-no-files-found: error
          retention-days: 30
